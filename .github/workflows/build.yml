name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the workflow can create the GitHub Release and attach the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        run: base64 -d ci/zmusic.keystore.b64 > ci/zmusic.jks

      # Manrope and JetBrains Mono are SIL Open Font License. They are downloaded at build time
      # so the repo stays free of binary files.
      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease -PverCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Zmusic-v0.2.${{ github.run_number }}.apk

      # The APK is attached directly to the Release, so it downloads as a plain .apk, not a zip.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Zmusic v0.2.${{ github.run_number }}
          body: Signed release build. Download the .apk below and install it.
          files: Zmusic-v0.2.${{ github.run_number }}.apk
          make_latest: true
